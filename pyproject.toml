[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasticfractals"
version = "1.0.0"
description = "High-performance mathematical fractal generator, arbitrary-precision deep zoom engine, and 4K/video exporter."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "FantasticFractals Contributors" }
]
keywords = [
  "fractals",
  "mandelbrot",
  "julia-set",
  "chaos-theory",
  "mathematics",
  "visualization",
  "deep-zoom",
  "generative-art",
  "numba",
  "numpy"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Graphics",
  "Operating System :: Microsoft :: Windows",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "numpy>=1.22.0",
  "pillow>=9.0.0"
]

[project.optional-dependencies]
accelerate = ["numba>=0.56.0"]
video = ["imageio>=2.20.0"]
precision = ["mpmath>=1.2.0"]
all = [
  "numba>=0.56.0",
  "imageio>=2.20.0",
  "mpmath>=1.2.0"
]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
fantasticfractals = "fantasticfractals.cli.main:main"

[project.urls]
Homepage = "https://fantasticfractals.pages.dev"
Repository = "https://github.com/QuantumTechCoder/FantasticFractals/tree/python"
WebVersion = "https://github.com/QuantumTechCoder/FantasticFractals/tree/website"
Documentation = "https://github.com/QuantumTechCoder/FantasticFractals/tree/python#readme"
Issues = "https://github.com/QuantumTechCoder/FantasticFractals/issues"

[tool.setuptools.packages.find]
where = ["src"]
